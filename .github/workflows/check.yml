name: Build and offline checks

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
          architecture: x64
      - name: Install pinned build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Fetch verified native compiler
        run: python scripts/fetch_toolchain.py
      - name: Build all native camera libraries
        run: python scripts/build_native.py
      - name: Run synthetic UI, ticket, IPC and isolated protocol tests
        run: python scripts/run_offline_tests.py
      - name: Build the app bundle without launching a camera
        run: python scripts/build_app.py
